<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon: "1399" over an ESPP price line. Purple = lookback start, green = purchase
       (15% under the lower of the two prices, so below the line), orange = sale. -->
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7fe0"/><stop offset="1" stop-color="#1b4fa0"/></linearGradient></defs>
  <rect class="bg" width="512" height="512" rx="112" fill="url(#bg)"/>
  <g class="art">
    <text x="256" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="132" fill="#fff" letter-spacing="4">1399</text>
    <g transform="translate(51.2 113.2) scale(.8)">
      <path d="M100 310 L170 284 L236 250 L300 282 L404 160" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M344 160 H404 V220" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="100" cy="310" r="22" fill="#9b6cf0" stroke="#fff" stroke-width="8"/>
      <circle cx="236" cy="362" r="22" fill="#1baf7a" stroke="#fff" stroke-width="8"/>
      <circle cx="404" cy="160" r="22" fill="#eb6834" stroke="#fff" stroke-width="8"/>
    </g>
  </g>
</svg>
